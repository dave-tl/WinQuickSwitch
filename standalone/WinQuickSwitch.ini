; =============================================================================
; WinQuickSwitch Configuration
; =============================================================================
;
; Place this file next to WinQuickSwitch.exe
;

[Hotkey]
; The key to toggle between virtual desktops.
;
; Single characters: ` - = [ ] \ ; ' , . / A-Z 0-9
; Named keys: BACKTICK, TAB, SPACE, ESCAPE, CAPSLOCK, INSERT, DELETE,
;             HOME, END, PAGEUP, PAGEDOWN, PAUSE, SCROLLLOCK, PRINTSCREEN,
;             F1-F24, NUMPAD0-NUMPAD9
;
; Default: ` (backtick)
Key=`

; Optional modifier key(s). Combine with + (e.g., CTRL+ALT)
; Values: NONE, CTRL, ALT, SHIFT, WIN
;
; Default: NONE (no modifier - just the key alone)
Modifier=NONE

[General]
; Start automatically when Windows starts (0 = no, 1 = yes)
; Can also be toggled from the system tray right-click menu.
StartWithWindows=0
